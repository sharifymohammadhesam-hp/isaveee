name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Arrange project files
        run: |
          mkdir -p app/src/main/java/com/example/isavee app/src/main/res/xml app/src/main/res/drawable app/src/main/assets
          mv MainActivity.kt app/src/main/java/com/example/isavee/
          mv AndroidManifest.xml app/src/main/
          mv paths.xml app/src/main/res/xml/
          mv isavee_icon.xml app/src/main/res/drawable/
          mv index.html app/src/main/assets/
          mv app-build.gradle.kts app/build.gradle.kts
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7
      - name: Build debug APK
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: isavee-apk
          path: app/build/outputs/apk/debug/app-debug.apk
